[project]
name = "labelloop-api"
version = "0.0.0"
description = "Labelloop FastAPI service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "certifi==2026.10.23",
  "urllib3==2.8.0",
  "fastapi==0.135.1",
  "pydantic==2.13.0",
  "sqlalchemy==2.0.50",
  "alembic==1.18.4",
  "argon2-cffi==25.1.0",
  "psycopg[binary]==3.3.3",
  "minio==7.2.20",
  "uvicorn==0.40.0",
  "labelloop-core",
  "labelloop-compiler",
  "labelloop-worker-core",
]

[project.scripts]
labelloop-api = "labelloop_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labelloop_api"]

[tool.uv.sources]
labelloop-core = { workspace = true }
labelloop-compiler = { workspace = true }
labelloop-worker-core = { workspace = true }
