title = "Labelloop secret scanning"

[extend]
useDefault = true

# Recognize the short, inert upstream example before the unchanged default
# private-key alternative. Its 64-character minimum otherwise spans the next PEM
# header, so an allowlist must not classify that oversized match as harmless.
[[rules]]
id = "private-key"
regex = '''-----BEGIN[ ]PRIVATE[ ]KEY-----\\{1,2}nYOUR_GCP_PRIVATE_KEY\\{1,2}n-----END PRIVATE KEY-----|(?i)-----BEGIN[ A-Z0-9_-]{0,100}PRIVATE KEY(?: BLOCK)?-----[\s\S-]{64,}?KEY(?: BLOCK)?-----'''

# Both the exact snapshot path and the complete literal secret must match.
# No commit/path-only/rule-wide ignore; real payloads in this file still fail.
[[rules.allowlists]]
condition = "AND"
paths = ['''(^|/)packages/platform/src/labelloop_platform/contract/openapi\.json$''']
regexTarget = "secret"
regexes = ['''^-----BEGIN[ ]PRIVATE[ ]KEY-----\\{1,2}nYOUR_GCP_PRIVATE_KEY\\{1,2}n-----END PRIVATE KEY-----$''']

# Anchor this allowlist to generic-api-key only; the default rule regex stays
# in force (useDefault), so other matches, including any other key assigned in
# this file, still flag.
[[rules]]
id = "generic-api-key"

# An inert test idempotency key (key="..." assignment shape, not a credential)
# on a sibling branch; the exact test path and complete literal must both
# match. No path-only, secret-only, or rule-wide ignore; real keys still fail.
[[rules.allowlists]]
condition = "AND"
paths = ['''(^|/)apps/api/tests/test_management_canonical_db\.py$''']
regexTarget = "secret"
regexes = ['''^compile-evaluation-640$''']
