[project]
name = "labelloop-worker-ml"
version = "0.0.0"
description = "CPU-only Ultralytics worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "labelloop-core",
  "ultralytics==8.4.204",
  "torch==2.9.1",
  "onnx==1.20.1",
  "onnxruntime==1.24.4",
  "torchvision==0.24.1+cpu; sys_platform == 'linux'",
  "torchvision==0.24.1; sys_platform != 'linux'",
]

[project.scripts]
labelloop-worker-ml = "labelloop_worker_ml.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labelloop_worker_ml"]
