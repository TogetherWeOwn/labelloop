[project]
name = "labelloop-worker-ml"
version = "0.0.0"
description = "CPU-only Ultralytics worker"
requires-python = ">=3.12,<3.13"
dependencies = ["ultralytics==8.4.204", "torch==2.9.1"]

[project.scripts]
labelloop-worker-ml = "labelloop_worker_ml.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labelloop_worker_ml"]
