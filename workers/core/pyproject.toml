[project]
name = "labelloop-worker-core"
version = "0.0.0"
description = "Non-ML job runner"
requires-python = ">=3.12,<3.13"
dependencies = ["psycopg[binary]==3.3.3"]

[project.scripts]
labelloop-worker-core = "labelloop_worker_core.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labelloop_worker_core"]
