[project]
name = "labelloop-worker-platform"
version = "0.0.0"
description = "Typed platform credential worker port"
requires-python = ">=3.12,<3.13"
dependencies = ["labelloop-credentials"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labelloop_worker_platform"]

[tool.uv.sources]
labelloop-credentials = { workspace = true }
