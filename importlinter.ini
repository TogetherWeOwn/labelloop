[importlinter]
root_packages =
    labelloop_core
    labelloop_compiler
    labelloop_platform
    labelloop_llm
    labelloop_api
    labelloop_worker_core
    labelloop_worker_ml
include_external_packages = True

[importlinter:contract:ultralytics-licence-boundary]
name = Ultralytics imports stay in permitted packages
type = forbidden
source_modules =
    labelloop_core
    labelloop_compiler
    labelloop_compiler.*
    labelloop_llm
    labelloop_llm.*
    labelloop_api
    labelloop_api.*
    labelloop_worker_core
    labelloop_worker_core.*
forbidden_modules =
    ultralytics
    ultralytics_platform
