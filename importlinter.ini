[importlinter]
root_packages =
    labelloop_core
    labelloop_compiler
    labelloop_platform
    labelloop_llm
    labelloop_api
    labelloop_worker_core
    labelloop_worker_ml
    labelloop_credentials
    labelloop_worker_llm
    labelloop_worker_platform
include_external_packages = True

[importlinter:contract:ultralytics-licence-boundary]
name = Ultralytics imports stay in permitted packages
type = forbidden
source_modules =
    labelloop_core
    labelloop_compiler
    labelloop_compiler.*
    labelloop_llm
    labelloop_llm.*
    labelloop_api
    labelloop_api.*
    labelloop_worker_core
    labelloop_worker_core.*
    labelloop_credentials
    labelloop_credentials.*
    labelloop_worker_llm
    labelloop_worker_llm.*
    labelloop_worker_platform
    labelloop_worker_platform.*
forbidden_modules =
    ultralytics
    ultralytics_platform

[importlinter:contract:api-no-unwrap]
name = API and non-secret workers never import private-key capabilities
type = forbidden
source_modules =
    labelloop_api
    labelloop_worker_core
    labelloop_worker_ml
forbidden_modules =
    labelloop_credentials._worker
    labelloop_worker_llm
    labelloop_worker_platform

[importlinter:contract:llm-no-platform-unwrap]
name = LLM worker never imports Platform unwrap
type = forbidden
source_modules =
    labelloop_worker_llm
forbidden_modules =
    labelloop_worker_platform

[importlinter:contract:platform-no-llm-unwrap]
name = Platform worker never imports LLM unwrap
type = forbidden
source_modules =
    labelloop_worker_platform
forbidden_modules =
    labelloop_worker_llm
