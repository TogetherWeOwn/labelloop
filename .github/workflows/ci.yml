name: CI

# Adapted from the org starter CI. Only job-level gates are used here:
# never put a workflow-level paths filter on the ci-ok producer.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group: {}
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: TogetherWeOwn/.github/.github/workflows/changes.yml@773ee91a904b9e1b65eddaaad4400d36e05fa717
    with:
      areas-json: '{"python":["packages/**","apps/api/**","workers/**","scripts/**","fixtures/**","pyproject.toml","uv.lock","importlinter.ini","Makefile","Dockerfile","compose.yaml"],"web":["apps/web/**","docs/design/mockups/src/tokens.css","pnpm-lock.yaml","pnpm-workspace.yaml"],"docs":["docs/**","README.md","AGENTS.md"]}'
      full-run-globs-json: '[".github/**","Dockerfile*","**/Dockerfile*","docker-compose*.yml","compose.yaml","Makefile*","**/Makefile*","package.json","**/package.json","package-lock.json","**/package-lock.json","npm-shrinkwrap.json","**/npm-shrinkwrap.json","pnpm-lock.yaml","**/pnpm-lock.yaml","pnpm-workspace.yaml","**/pnpm-workspace.yaml","pyproject.toml","**/pyproject.toml","uv.lock","**/uv.lock","requirements*.txt","**/requirements*.txt","tsconfig*.json","**/tsconfig*.json"]'
      docs-areas-json: '["docs"]'

  full-run:
    outputs:
      force: ${{ steps.context.outputs.force }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: context
        run: |
          echo "force=${{ github.event_name != 'pull_request' }}" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@6ee6290f1cbc4156c0bdd66691b2c144ef8df19a # v7.4.0
        with:
          version: "0.13.6"
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: actionlint (checksum-pinned)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: "1.32.0"
          advanced-security: false
      - name: Immutable lockfile resolution
        run: uv lock --check

  types:
    needs: [changes, full-run]
    if: needs.full-run.outputs.force == 'true' || needs.changes.outputs.full_run == 'true' || fromJSON(needs.changes.outputs.areas).python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@6ee6290f1cbc4156c0bdd66691b2c144ef8df19a # v7.4.0
        with:
          version: "0.13.6"
          enable-cache: false
      - run: uv sync --frozen
      # M0 mandates strict core typing; other packages get extended gates in later milestones.
      - run: uv run mypy --strict packages/core

  unit:
    needs: [changes, full-run]
    if: needs.full-run.outputs.force == 'true' || needs.changes.outputs.full_run == 'true' || fromJSON(needs.changes.outputs.areas).python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@6ee6290f1cbc4156c0bdd66691b2c144ef8df19a # v7.4.0
        with:
          version: "0.13.6"
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run pytest
      - run: uv run python scripts/check-fixtures.py

  import-contract:
    needs: [changes, full-run]
    if: needs.full-run.outputs.force == 'true' || needs.changes.outputs.full_run == 'true' || fromJSON(needs.changes.outputs.areas).python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@6ee6290f1cbc4156c0bdd66691b2c144ef8df19a # v7.4.0
        with:
          version: "0.13.6"
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run python scripts/check-import-contract.py
      - run: git diff --exit-code

  web-build:
    needs: [changes, full-run]
    if: needs.full-run.outputs.force == 'true' || needs.changes.outputs.full_run == 'true' || fromJSON(needs.changes.outputs.areas).web
    # The pinned Playwright release supports Ubuntu 24.04, not rolling latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.28.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web build
        env:
          VITE_PLATFORM_KEY: ul_secretSentinelNeverBundle123456
          VITE_AUTH_HEADER: Bearer bundleSentinelCredential123456
      - run: pnpm --dir apps/web build:operations
      - run: pnpm --dir apps/web build:platform-fixture
        env:
          VITE_PLATFORM_KEY: ul_secretSentinelNeverBundle123456
          VITE_AUTH_HEADER: Bearer bundleSentinelCredential123456
      - name: Scan application and fixture bundles for secrets
        run: docker run --rm -v "$PWD/apps/web/dist:/scan:ro" zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f dir /scan --redact --exit-code 1
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: pnpm --dir apps/web test:operations
      - run: pnpm --dir apps/web test:platform-browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: operational-ui-evidence
          path: |
            apps/web/dist/operations-evidence
            apps/web/dist/operations-report
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: platform-ui-evidence
          path: apps/web/platform-evidence/
          if-no-files-found: error
          retention-days: 7

  dev-stack:
    needs: [changes, full-run]
    if: needs.full-run.outputs.force == 'true' || needs.changes.outputs.full_run == 'true' || (fromJSON(needs.changes.outputs.areas).python || fromJSON(needs.changes.outputs.areas).web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@6ee6290f1cbc4156c0bdd66691b2c144ef8df19a # v7.4.0
        with:
          version: "0.13.6"
          enable-cache: false
      - run: uv sync --frozen
      - run: make dev
      - run: curl --fail --show-error --silent --retry 5 --retry-connrefused http://localhost:5173/api/readyz
      - run: docker compose logs --no-color
        if: always()
      - name: Stop development stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  ml-smoke:
    needs: [changes, full-run]
    if: needs.full-run.outputs.force == 'true' || needs.changes.outputs.full_run == 'true' || fromJSON(needs.changes.outputs.areas).python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LABELLOOP_ML_SMOKE: "1"
      YOLO_OFFLINE: "true"
      YOLO_AUTOINSTALL: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      DATABASE_URL: postgresql+psycopg://fixture:fixture@localhost:5432/labelloop
    services:
      postgres:
        image: docker.io/pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: labelloop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture -d labelloop"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@6ee6290f1cbc4156c0bdd66691b2c144ef8df19a # v7.4.0
        with:
          version: "0.13.6"
          enable-cache: false
      - run: uv sync --frozen --group ml
      - name: Check clean migration upgrade, downgrade and re-upgrade
        run: |
          uv run alembic -c apps/api/alembic.ini upgrade head
          uv run alembic -c apps/api/alembic.ini downgrade base
          uv run alembic -c apps/api/alembic.ini upgrade head
      - name: Budget ledger PostgreSQL races, restart and atomic rollback
        run: uv run pytest apps/api/tests/test_budget_store.py -v
        env:
          LABELLOOP_BUDGET_POSTGRES: "1"
      - run: uv run --group ml pytest workers/ml/tests/test_local_training.py -v --basetemp=ml-smoke-evidence
        env:
          YOLO_CONFIG_DIR: ${{ runner.temp }}/yolo-config
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ml-smoke-evidence
          path: |
            ml-smoke-evidence/**/*.json
            ml-smoke-evidence/**/args.yaml
            ml-smoke-evidence/**/results.csv
          if-no-files-found: error
          retention-days: 7

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, full-run, lint, types, unit, import-contract, web-build, dev-stack, ml-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python -I scripts/check_ci_results.py "$NEEDS_JSON" "$AREAS_JSON" "$FULL_RUN"
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          AREAS_JSON: ${{ needs.changes.outputs.areas }}
          FULL_RUN: ${{ needs.full-run.outputs.force == 'true' || needs.changes.outputs.full_run == 'true' }}
