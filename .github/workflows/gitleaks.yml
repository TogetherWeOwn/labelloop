name: gitleaks

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Platform example classification across new commit identities
        run: python3 scripts/check-platform-secret-classification.py --image zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
      - name: Test counts-only diagnostic with synthetic data
        run: python3 -I scripts/test_gitleaks_counts.py
      - name: Scan full history
        id: scan
        run: >-
          docker run --rm -v "$PWD:/repo" -v "$RUNNER_TEMP:/reports"
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source /repo --redact --exit-code 1
          --report-format json --report-path /reports/gitleaks.json
          > /dev/null 2>&1
      - name: Show counts without report metadata
        if: ${{ !cancelled() && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') }}
        run: |
          set +x
          python3 -I scripts/gitleaks_counts.py "$RUNNER_TEMP/gitleaks.json" 2>/dev/null
