name: gitleaks

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full history
        run: >-
          docker run --rm -v "$PWD:/repo" -v "$RUNNER_TEMP:/reports"
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source /repo --redact --exit-code 1
          --report-format json --report-path /reports/gitleaks.json
      - name: Show finding locations without secret values
        if: failure()
        run: |
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          report = Path(os.environ["RUNNER_TEMP"]) / "gitleaks.json"
          if report.exists():
              for finding in json.loads(report.read_text()):
                  # Never print Match, Secret, or the full report; no artifact upload.
                  location = {key: finding.get(key) for key in (
                      "RuleID", "File", "StartLine", "Commit"
                  )}
                  print(json.dumps(location, ensure_ascii=True))
          PY
