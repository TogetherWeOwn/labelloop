[project]
name = "labelloop-compiler"
version = "0.0.0"
description = "Deterministic YOLO dataset compiler"
requires-python = ">=3.12,<3.13"
dependencies = [
  "labelloop-core",
  "numpy==2.5.4",
  "pillow==13.0.0",
  "opencv-python-headless==4.13.0.92",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labelloop_compiler"]

[tool.uv.sources]
labelloop-core = { workspace = true }
