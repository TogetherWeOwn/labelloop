[project]
name = "labelloop-credentials"
version = "0.0.0"
description = "Shared typed encrypted provider credential boundary"
requires-python = ">=3.12,<3.13"
dependencies = ["cryptography==50.0.2", "sqlalchemy==2.0.50"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labelloop_credentials"]
