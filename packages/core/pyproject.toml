[project]
name = "labelloop-core"
version = "0.0.0"
description = "Pure Python domain model and geometry"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.5.4", "pillow==12.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labelloop_core"]
