[project]
name = "labelloop-platform"
version = "0.0.0"
description = "Ultralytics Platform adapter boundary"
requires-python = ">=3.12,<3.13"
dependencies = ["labelloop-core", "ultralytics-platform==0.1.107"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labelloop_platform"]
